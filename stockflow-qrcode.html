<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>StockFlow - Inteligência Logística para Estoques</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --blue-dark: #0B4F6C;
      --blue-light: #4EA5D9;
      --white: #FFFFFF;
      --gray-light: #F5F7FA;
      --text-dark: #1F2933;
      --text-muted: #7B8794;
      --border: #E4E7EB;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #e0f2ff 0, #f5f7fa 40%, #e3ecf5 100%);
      color: var(--text-dark);
    }

    .app-shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }

    @media (max-width: 900px) {
      .app-shell {
        grid-template-columns: 70px minmax(0, 1fr);
      }
      .sidebar-label {
        display: none;
      }
      .sidebar-header h1 {
        display: none;
      }
      .sidebar-header span {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        grid-template-columns: 0 minmax(0, 1fr);
      }
      .sidebar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 64px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-inline: 20px;
        border-radius: 0;
      }
      .sidebar-nav {
        display: flex;
        gap: 16px;
      }
      .main {
        padding-top: 80px;
      }
    }

    .sidebar {
      background: linear-gradient(180deg, #0B4F6C 0%, #062D3C 100%);
      color: #E4FBFF;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      border-right: 1px solid rgba(148, 163, 184, 0.15);
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.45);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 14px;
      background: radial-gradient(circle at 0 0, #4EA5D9 0, #0B4F6C 40%, #02151E 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F9FBFF;
      font-weight: 600;
      font-size: 18px;
      position: relative;
      overflow: hidden;
    }

    .logo-mark::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .sidebar-header h1 {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .sidebar-header span {
      display: block;
      font-size: 11px;
      color: rgba(226, 239, 255, 0.75);
    }

    .sidebar-section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(216, 235, 255, 0.7);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      color: rgba(226, 239, 255, 0.86);
      font-size: 13px;
      transition: background 0.16s ease, transform 0.14s ease, border-color 0.16s ease;
      background: none;
    }

    .nav-item:hover {
      background: rgba(10, 74, 100, 0.92);
      border-color: rgba(148, 163, 184, 0.55);
      transform: translateY(-1px);
    }

    .nav-item.active {
      background: linear-gradient(90deg, #4EA5D9 0%, #2f88bf 55%, #0B4F6C 100%);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.45);
      color: #02151E;
      font-weight: 600;
    }

    .nav-icon {
      width: 22px;
      height: 22px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .nav-item.active .nav-icon {
      background: rgba(3, 9, 16, 0.16);
    }

    .sidebar-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 11px;
      color: rgba(210, 232, 255, 0.85);
    }

    .sidebar-pill {
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(191, 219, 254, 0.55);
      background: radial-gradient(circle at 0 0, rgba(148, 198, 255, 0.16), rgba(9, 31, 45, 0.95));
    }

    .sidebar-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.18);
    }

    .main {
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .top-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .top-title h2 {
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    .top-title span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(6px);
    }

    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: linear-gradient(135deg, #4EA5D9, #0B4F6C);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-shell {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      padding: 3px 10px;
      border: 1px solid rgba(209, 213, 219, 0.8);
      box-shadow: 0 12px 30px rgba(148, 163, 184, 0.25);
      max-width: 340px;
      flex: 1;
    }

    .search-shell input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 13px;
      flex: 1;
    }

    .search-shell span {
      font-size: 13px;
      color: var(--text-muted);
    }

    .btn {
      border-radius: 999px;
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.14s ease, background 0.16s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0B4F6C, #4EA5D9);
      color: #F9FBFF;
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.35);
      border: 1px solid rgba(15, 23, 42, 0.5);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.8);
      color: var(--text-dark);
      border: 1px solid rgba(209, 213, 219, 0.9);
    }

    .btn-icon {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.35);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.25);
    }

    .layout-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(0, 1.2fr);
      gap: 18px;
    }

    @media (max-width: 960px) {
      .layout-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .surface {
      background: rgba(255, 255, 255, 0.95);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(226, 232, 240, 0.9);
      padding: 16px 16px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }

    .surface-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .surface-header h3 {
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .surface-header span {
      font-size: 11px;
      color: var(--text-muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid rgba(209, 213, 219, 0.9);
      background: rgba(248, 250, 252, 0.95);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #4EA5D9;
    }

    .indicator-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width: 800px) {
      .indicator-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .indicator-card {
      border-radius: 14px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      background: radial-gradient(circle at 0 0, rgba(209, 250, 255, 0.7), rgba(248, 249, 252, 1));
      padding: 10px 11px 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .indicator-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      pointer-events: none;
    }

    .indicator-label {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
